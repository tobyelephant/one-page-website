<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="work-mode">
  <main class="app">
    <h1>Pomodoro Timer</h1>

    <p class="mode-label">Current mode: <span id="mode">Work Session</span></p>
    <p id="timer" aria-live="polite">25:00</p>

    <div class="progress" aria-label="Session progress">
      <div id="progressBar"></div>
    </div>

    <section class="settings" aria-label="Timer settings">
      <label for="presetSelect">Timer preset</label>
      <select id="presetSelect">
        <option value="classic">Classic (25 / 5)</option>
        <option value="deepFocus">Deep Focus (50 / 10)</option>
      </select>

      <label for="soundSelect">Background sound</label>
      <select id="soundSelect">
        <option value="none">No Sound</option>
        <option value="ocean">Ocean</option>
        <option value="forest">Forest</option>
        <option value="rain">Rain</option>
      </select>
    </section>

    <div class="controls" aria-label="Timer controls">
      <button id="startButton" type="button">Start</button>
      <button id="pauseButton" type="button">Pause</button>
      <button id="resetButton" type="button">Reset</button>
    </div>

    <p class="session-count">Completed sessions: <span id="sessionCount">0</span></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
