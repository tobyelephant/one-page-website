<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="work-mode">
  <main class="app">
    <h1>Pomodoro Timer</h1>

    <p class="mode-label">Current mode: <span id="mode">Work Session</span></p>
    <p id="timer" aria-live="polite">25:00</p>

    <div class="progress" aria-label="Session progress">
      <div id="progressBar"></div>
    </div>

    <section class="settings" aria-label="Timer settings">
      <div class="setting-group">
        <p class="setting-title">Timer preset</p>
        <div class="choice-grid" aria-label="Timer preset choices">
          <button class="choice-button active" type="button" data-preset="classic" aria-pressed="true">Classic <span>25 / 5</span></button>
          <button class="choice-button" type="button" data-preset="deepFocus" aria-pressed="false">Deep Focus <span>50 / 10</span></button>
        </div>
      </div>

      <div class="setting-group">
        <p class="setting-title">Background sound</p>
        <div class="sound-grid" aria-label="Background sound choices">
          <button class="sound-button active" type="button" data-sound="none" aria-pressed="true">No Sound</button>
          <button class="sound-button" type="button" data-sound="ocean" aria-pressed="false">Ocean</button>
          <button class="sound-button" type="button" data-sound="forest" aria-pressed="false">Forest</button>
          <button class="sound-button" type="button" data-sound="rain" aria-pressed="false">Rain</button>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="Timer controls">
      <button class="action-button" id="startButton" type="button">Start</button>
      <button class="action-button" id="pauseButton" type="button">Pause</button>
      <button class="action-button" id="resetButton" type="button">Reset</button>
    </div>

    <p class="session-count">Completed sessions: <span id="sessionCount">0</span></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
